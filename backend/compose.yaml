services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: baetee
      POSTGRES_USER: baetee
      POSTGRES_PASSWORD: ${BAETEE_LOCAL_DB_PASSWORD:?Run scripts/prepare-local-env.ps1 first}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - baetee-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U baetee -d baetee"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - baetee-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  baetee-postgres:
  baetee-redis:
